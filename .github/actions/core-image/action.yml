name: Build Core image
description: >-
  The one Core image build definition, shared by the main Tests prebuild and
  the Release OSS fallback, so labels, build arguments, platform, cache and
  attestations cannot drift between them.

inputs:
  source_sha:
    description: Exact source commit, recorded as revision label and build argument
    required: true
  core_tag:
    description: Release tag recorded in the version label, such as core-v1.2.3
    required: true
  tags:
    description: Newline-separated image references to push
    required: true
  push:
    description: Push the image to the registry
    default: 'true'

outputs:
  digest:
    description: Digest of the built image index
    value: ${{ steps.image.outputs.digest }}

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Build and publish immutable image
      id: image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        push: ${{ inputs.push }}
        tags: ${{ inputs.tags }}
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.revision=${{ inputs.source_sha }}
          org.opencontainers.image.version=${{ inputs.core_tag }}
        build-args: |
          TYPEROLL_SOURCE_SHA=${{ inputs.source_sha }}
        platforms: linux/amd64
        cache-from: type=gha,scope=core
        cache-to: type=gha,scope=core,mode=max
        sbom: true
        provenance: mode=max
