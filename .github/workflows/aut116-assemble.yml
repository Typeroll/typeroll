name: Assemble AUT-116 large files

on:
  push:
    branches:
      - cursor/remove-html-to-blocks-43c4
    paths:
      - .github/workflows/aut116-assemble.yml

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/remove-html-to-blocks-43c4
          fetch-depth: 0
      - name: Restore the three files that could not be uploaded whole
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- packages/portal/src/lib/anthropic.ts
          git apply .aut116/anthropic.patch
          node packages/mcp-server/scripts/embed-content.mjs
          python3 - << 'PY'
          from pathlib import Path
          path = Path("package-lock.json")
          text = path.read_text()
          updated = text.replace('"version": "0.2.53"', '"version": "0.2.54"')
          updated = updated.replace('"version": "0.45.40"', '"version": "0.45.41"', 1)
          if updated.count('"version": "0.2.54"') < 2 or '"version": "0.45.41"' not in updated:
              raise SystemExit("lockfile version replacement did not match")
          if updated == text:
              raise SystemExit("lockfile unchanged")
          path.write_text(updated)
          PY
          python3 - << 'PY'
          import hashlib
          from pathlib import Path
          expected = {
              "packages/portal/src/lib/anthropic.ts": "aa2faefc30446d839c1df6a4d04f2f29f66cbb4b4c5ab3e1fb99ef6ac6fccf51",
              "packages/mcp-server/src/bundled-content.ts": "b418d27903b44477cb4094e292e8387a8d45e9b179e2b9dff692d45bd43cc5be",
              "package-lock.json": "7f1119c0aa11cc190a3e7b06f1e0b6798275fa49c0ad1b61f7679d397ba1646f",
          }
          for path, digest in expected.items():
              actual = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              if actual != digest:
                  raise SystemExit(f"{path} hash {actual} != {digest}")
          print("hashes match")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/portal/src/lib/anthropic.ts packages/mcp-server/src/bundled-content.ts package-lock.json
          git rm -r .aut116 .github/workflows/aut116-assemble.yml
          git commit -m "Restore full anthropic source, bundled skills, and lockfile versions."
          git push origin HEAD:cursor/remove-html-to-blocks-43c4
