name: Docs

on:
  push:
    branches: [main]
    paths:
      - "packages/docs-site/**"
      - "package-lock.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and deploy public docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --workspace=@typeroll/docs-site
      - name: Check formatting
        run: npx prettier --check "packages/docs-site/src/**/*.{md,mdx}"
      - name: Build docs
        run: npm run build --workspace=@typeroll/docs-site
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DOCS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler pages deploy packages/docs-site/dist --project-name=typeroll-docs --branch=main
