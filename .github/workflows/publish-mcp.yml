name: Publish MCP server

# Normal release flow:
#
#   1. Bump packages/mcp-server/package.json.
#   2. Push main.
#   3. This workflow waits for the complete Tests workflow to pass, builds and
#      inspects the package, publishes it through npm Trusted Publishing, and
#      creates mcp-vX.Y.Z only after npm confirms the release.
#
# A manual dry run remains available for validating the package artifact. The
# workflow is serialized so adjacent main pushes cannot race each other.

on:
  workflow_run:
    workflows:
      - Tests
    types:
      - completed
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and inspect the package without publishing
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-mcp
  cancel-in-progress: false

jobs:
  publish:
    name: Build + publish to npm
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          scope: '@typeroll'
          cache: npm

      # npm 11.5+ supports Trusted Publishing. Pin the toolchain so a new npm
      # release cannot silently change the artifact or authentication path.
      - name: Install Trusted Publishing client
        run: npm install --global npm@11.6.2

      - name: Install workspace dependencies
        run: npm ci

      - name: Determine release plan
        id: plan
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE='@typeroll/mcp-server'
          PACKAGE_VERSION=$(node -p "require('./packages/mcp-server/package.json').version")
          RELEASE_SHA=$(git rev-parse HEAD)
          RELEASE_TAG="mcp-v${PACKAGE_VERSION}"
          NPM_LATEST=$(npm view "$PACKAGE" version 2>/dev/null || printf '0.0.0')
          ALREADY_ON_NPM=false
          TAG_EXISTS=false
          SHOULD_TAG=false

          if npm view "${PACKAGE}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            ALREADY_ON_NPM=true
          fi

          if git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}" >/dev/null; then
            TAG_EXISTS=true
            TAG_SHA=$(git rev-list -n 1 "$RELEASE_TAG")
            if [ "$TAG_SHA" != "$RELEASE_SHA" ] && [ "$ALREADY_ON_NPM" != 'true' ]; then
              echo "::error::${RELEASE_TAG} points to ${TAG_SHA}, not release commit ${RELEASE_SHA}."
              exit 1
            fi
          elif [ "$ALREADY_ON_NPM" != 'true' ]; then
            SHOULD_TAG=true
          else
            PUBLISHED_SHA=$(npm view "${PACKAGE}@${PACKAGE_VERSION}" gitHead 2>/dev/null || true)
            if [ "$PUBLISHED_SHA" = "$RELEASE_SHA" ]; then
              SHOULD_TAG=true
            else
              echo "::warning title=Missing release tag::${PACKAGE}@${PACKAGE_VERSION} exists on npm, but ${RELEASE_TAG} cannot be safely attached to ${RELEASE_SHA}. Published gitHead: ${PUBLISHED_SHA:-unavailable}."
            fi
          fi

          SHOULD_PUBLISH=true
          if [ "$ALREADY_ON_NPM" = 'true' ]; then
            SHOULD_PUBLISH=false
          fi

          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "npm_latest=$NPM_LATEST" >> "$GITHUB_OUTPUT"
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "already_on_npm=$ALREADY_ON_NPM" >> "$GITHUB_OUTPUT"
          echo "tag_exists=$TAG_EXISTS" >> "$GITHUB_OUTPUT"
          echo "should_publish=$SHOULD_PUBLISH" >> "$GITHUB_OUTPUT"
          echo "should_tag=$SHOULD_TAG" >> "$GITHUB_OUTPUT"

          if [ "$ALREADY_ON_NPM" = 'true' ]; then
            LAST_TAG="mcp-v${NPM_LATEST}"
            LAST_TAG_SHA=$(git rev-list -n 1 "$LAST_TAG" 2>/dev/null || true)
            if [ -n "$LAST_TAG_SHA" ]; then
              CHANGED=$(git diff --name-only "$LAST_TAG_SHA" HEAD -- \
                packages/mcp-server/src \
                packages/mcp-server/AGENTS.md \
                packages/mcp-server/skills \
                packages/shared/src || true)
              if [ -n "$CHANGED" ]; then
                echo "::warning title=MCP version drift::MCP-relevant files changed since ${LAST_TAG}, but packages/mcp-server/package.json is still ${PACKAGE_VERSION}."
                printf '%s\n' "$CHANGED" | sed 's/^/  - /'
              fi
            fi
          fi

      - name: Write release summary
        run: |
          {
            echo '### MCP release plan'
            echo
            echo '| Field | Value |'
            echo '| --- | --- |'
            echo '| Commit | `${{ steps.plan.outputs.release_sha }}` |'
            echo '| Package version | `${{ steps.plan.outputs.package_version }}` |'
            echo '| npm latest before run | `${{ steps.plan.outputs.npm_latest }}` |'
            echo '| Already on npm | `${{ steps.plan.outputs.already_on_npm }}` |'
            echo '| Publish | `${{ steps.plan.outputs.should_publish }}` |'
            echo '| Create tag | `${{ steps.plan.outputs.should_tag }}` |'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Typecheck and test MCP server
        if: steps.plan.outputs.should_publish == 'true'
        run: |
          npm run typecheck --workspace=@typeroll/mcp-server
          npm test --workspace=@typeroll/mcp-server

      - name: Build MCP server
        if: steps.plan.outputs.should_publish == 'true'
        run: npm run build --workspace=@typeroll/mcp-server

      - name: Inspect package artifact
        if: steps.plan.outputs.should_publish == 'true'
        working-directory: packages/mcp-server
        run: npm publish --dry-run

      - name: Publish to npm
        if: >-
          steps.plan.outputs.should_publish == 'true' &&
          (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        working-directory: packages/mcp-server
        run: npm publish --access public --provenance

      - name: Verify npm release
        if: >-
          steps.plan.outputs.should_publish == 'true' &&
          (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        env:
          PACKAGE_VERSION: ${{ steps.plan.outputs.package_version }}
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            PUBLISHED=$(npm view "@typeroll/mcp-server@${PACKAGE_VERSION}" version 2>/dev/null || true)
            if [ "$PUBLISHED" = "$PACKAGE_VERSION" ]; then
              echo "Verified @typeroll/mcp-server@${PACKAGE_VERSION} on npm."
              exit 0
            fi
            sleep 5
          done
          echo "::error::npm did not return @typeroll/mcp-server@${PACKAGE_VERSION} after publication."
          exit 1

      - name: Create release tag
        if: >-
          steps.plan.outputs.should_tag == 'true' &&
          (steps.plan.outputs.already_on_npm == 'true' ||
           github.event_name != 'workflow_dispatch' ||
           inputs.dry_run != true)
        env:
          RELEASE_TAG: ${{ steps.plan.outputs.release_tag }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - name: Nothing to publish
        if: steps.plan.outputs.should_publish != 'true'
        run: echo '@typeroll/mcp-server@${{ steps.plan.outputs.package_version }} is already published.'

# One-time npm setup:
# Configure @typeroll/mcp-server Trusted Publishing for GitHub Actions,
# organization Typeroll, repository typeroll, workflow publish-mcp.yml, with no
# environment name. Keep npm's publishing 2FA requirement enabled.
