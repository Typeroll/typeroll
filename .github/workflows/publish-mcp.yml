name: Release OSS

# One release train for the public distribution:
# successful main CI -> Core, MCP and docs in parallel -> manifest.
# Keep this filename: npm Trusted Publishing is bound to publish-mcp.yml.

on:
  workflow_run:
    workflows:
      - Tests
    types:
      - completed
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate and build without publishing anything
        type: boolean
        default: true
      confirm_release:
        description: Type RELEASE_TYPEROLL_OSS for a manual real release
        type: string
        required: false

# No default grant: each job requests only what its own steps need.
permissions: {}

concurrency:
  group: release-oss
  cancel-in-progress: false

jobs:
  plan:
    name: Validate release plan
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      tests_run_id: ${{ steps.qualified.outputs.run_id }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      core_source_sha: ${{ steps.plan.outputs.core_source_sha }}
      core_version: ${{ steps.plan.outputs.core_version }}
      core_tag: ${{ steps.plan.outputs.core_tag }}
      publish_core: ${{ steps.plan.outputs.publish_core }}
      mcp_version: ${{ steps.plan.outputs.mcp_version }}
      mcp_tag: ${{ steps.plan.outputs.mcp_tag }}
      publish_mcp: ${{ steps.plan.outputs.publish_mcp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.23.1'
          cache: npm
      - name: Resolve successful source qualification
        id: qualified
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: node scripts/qualified-docs.mjs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.qualified.outputs.run_id }}
          name: docs-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          path: temp/docs-migration
      - name: Verify qualified documentation before publication
        run: node scripts/release-artifact.mjs verify temp/docs-migration
      - name: Validate manual publication confirmation
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run != true
        env:
          CONFIRM_RELEASE: ${{ inputs.confirm_release }}
        run: test "$CONFIRM_RELEASE" = 'RELEASE_TYPEROLL_OSS'
      - name: Validate versions and changed scopes
        id: plan
        run: npm run release:plan -- --github-output
      - name: Summarize release plan
        env:
          CORE_VERSION: ${{ steps.plan.outputs.core_version }}
          PUBLISH_CORE: ${{ steps.plan.outputs.publish_core }}
          MCP_VERSION: ${{ steps.plan.outputs.mcp_version }}
          PUBLISH_MCP: ${{ steps.plan.outputs.publish_mcp }}
          SOURCE_SHA: ${{ steps.plan.outputs.source_sha }}
        run: |
          {
            echo '### OSS release plan'
            echo
            echo '| Artifact | Version | Publish |'
            echo '| --- | --- | --- |'
            printf '| Core | %s | %s |\n' "$CORE_VERSION" "$PUBLISH_CORE"
            printf '| MCP | %s | %s |\n' "$MCP_VERSION" "$PUBLISH_MCP"
            printf '| Source | %s | |\n' "$SOURCE_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

  core:
    name: Publish immutable Core
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      actions: read
    outputs:
      image_digest: ${{ steps.digest.outputs.image_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.23.1'
          cache: npm
      - name: Verify Core release version
        run: npm run core:release:verify -- "${{ needs.plan.outputs.core_tag }}"
      # The exact source SHA has already passed the complete release-candidate
      # workflow. This job proves the release-specific image contract instead
      # of repeating the same source gate.
      - uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7
        with:
          version: v0.22.0
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Main Tests record the digest they built for this exact source in their
      # own run. Only that digest is reused: any workflow that can write
      # packages could move the sha- tag or forge labels, but not this record.
      # A missing record or any download error builds as before.
      - name: Download prebuilt image record
        id: download_record
        if: needs.plan.outputs.publish_core == 'true'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.plan.outputs.tests_run_id }}
          name: core-image-${{ needs.plan.outputs.source_sha }}
          path: temp/core-image
      - name: Resolve prebuilt image record
        id: recorded
        if: needs.plan.outputs.publish_core == 'true'
        env:
          CORE_TAG: ${{ needs.plan.outputs.core_tag }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        run: |
          set -euo pipefail
          RECORD=temp/core-image/core-image.json
          if [ ! -f "$RECORD" ]; then
            echo 'The main Tests run recorded no prebuilt Core image for this source.'
            exit 0
          fi
          DIGEST=$(jq -r 'select(.source_sha == env.SOURCE_SHA and .core_tag == env.CORE_TAG) | .image_digest // empty' "$RECORD")
          if [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "image_digest=$DIGEST" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The prebuilt image record does not name $SOURCE_SHA/$CORE_TAG; building instead."
          fi
      - name: Inspect existing Core release
        id: registry
        if: needs.plan.outputs.publish_core == 'true'
        env:
          CORE_TAG: ${{ needs.plan.outputs.core_tag }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          RECORDED_DIGEST: ${{ steps.recorded.outputs.image_digest }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/typeroll/typeroll:$CORE_TAG"
          set +e
          RESULT=$(crane digest "$IMAGE" 2>&1)
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ]; then
            REVISION=$(crane config "$IMAGE@$RESULT" | jq -r '.config.Labels["org.opencontainers.image.revision"] // empty')
            if [ "$REVISION" != "$SOURCE_SHA" ]; then
              echo "::error::$IMAGE already exists at $RESULT from ${REVISION:-an unknown commit}, not $SOURCE_SHA."
              exit 1
            fi
            # With a recorded prebuilt image, an interrupted release can only
            # have tagged that exact digest.
            if [ -n "$RECORDED_DIGEST" ] && [ "$RESULT" != "$RECORDED_DIGEST" ]; then
              echo "::error::$IMAGE points at $RESULT, not the digest $RECORDED_DIGEST recorded by main Tests."
              exit 1
            fi
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            echo "image_digest=$RESULT" >> "$GITHUB_OUTPUT"
          elif grep -Eqi 'manifest unknown|manifest_unknown|name unknown|name_unknown|not found|404' <<<"$RESULT"; then
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          else
            echo "::error::Could not safely determine whether $IMAGE exists: $RESULT"
            exit 1
          fi
      # Main Tests prebuild the image with the shared build definition. Only the
      # exact digest recorded by that run is reused, and only while its labels
      # name this source and release; any other answer, including a registry
      # error, builds as before.
      - name: Inspect prebuilt Core image
        id: prebuilt
        if: needs.plan.outputs.publish_core == 'true' && steps.registry.outputs.exists != 'true'
        env:
          CORE_TAG: ${{ needs.plan.outputs.core_tag }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          RECORDED_DIGEST: ${{ steps.recorded.outputs.image_digest }}
        run: |
          set -euo pipefail
          if [[ "$RECORDED_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            IMAGE="ghcr.io/typeroll/typeroll@$RECORDED_DIGEST"
            LABELS=$(crane config "$IMAGE" 2>/dev/null || true)
            REVISION=$(jq -r '.config.Labels["org.opencontainers.image.revision"] // empty' <<<"$LABELS" 2>/dev/null || true)
            VERSION=$(jq -r '.config.Labels["org.opencontainers.image.version"] // empty' <<<"$LABELS" 2>/dev/null || true)
            if [ "$REVISION" = "$SOURCE_SHA" ] && [ "$VERSION" = "$CORE_TAG" ]; then
              echo "Reusing $IMAGE recorded by main Tests."
              echo 'exists=true' >> "$GITHUB_OUTPUT"
              echo "image_digest=$RECORDED_DIGEST" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::$IMAGE is labelled ${REVISION:-unknown}/${VERSION:-unknown}, not $SOURCE_SHA/$CORE_TAG; building instead."
          fi
          echo 'exists=false' >> "$GITHUB_OUTPUT"
      - name: Build and publish immutable image
        id: image
        if: >-
          needs.plan.outputs.publish_core == 'true' &&
          steps.registry.outputs.exists != 'true' &&
          steps.prebuilt.outputs.exists != 'true'
        uses: ./.github/actions/core-image
        with:
          source_sha: ${{ needs.plan.outputs.source_sha }}
          core_tag: ${{ needs.plan.outputs.core_tag }}
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
          tags: |
            ghcr.io/typeroll/typeroll:${{ needs.plan.outputs.core_tag }}
            ghcr.io/typeroll/typeroll:sha-${{ needs.plan.outputs.source_sha }}
      - name: Resolve release digest
        id: digest
        env:
          BUILT_DIGEST: ${{ steps.image.outputs.digest }}
          CORE_TAG: ${{ needs.plan.outputs.core_tag }}
          PUBLISH_CORE: ${{ needs.plan.outputs.publish_core }}
          EXISTING_DIGEST: ${{ steps.registry.outputs.image_digest }}
          PREBUILT_DIGEST: ${{ steps.prebuilt.outputs.image_digest }}
        run: |
          set -euo pipefail
          if [ -n "$EXISTING_DIGEST" ]; then
            DIGEST="$EXISTING_DIGEST"
          elif [ -n "$PREBUILT_DIGEST" ]; then
            DIGEST="$PREBUILT_DIGEST"
          elif [ "$PUBLISH_CORE" = 'true' ]; then
            test -n "$BUILT_DIGEST"
            DIGEST="$BUILT_DIGEST"
          else
            DIGEST=$(crane digest "ghcr.io/typeroll/typeroll:$CORE_TAG")
          fi
          test -n "$DIGEST"
          echo "image_digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Verify published image contract
        if: >-
          needs.plan.outputs.publish_core == 'true' &&
          (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        env:
          IMAGE: ghcr.io/typeroll/typeroll@${{ steps.digest.outputs.image_digest }}
          IMAGE_DIGEST: ${{ steps.digest.outputs.image_digest }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          CORE_VERSION: ${{ needs.plan.outputs.core_version }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          docker run --detach --name typeroll-core-contract \
            --publish 127.0.0.1:8080:8080 \
            --env TYPEROLL_IMAGE_DIGEST="$IMAGE_DIGEST" \
            "$IMAGE"
          trap 'docker rm --force typeroll-core-contract >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/api/healthz >/dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then docker logs typeroll-core-contract; exit 1; fi
            sleep 1
          done
          RELEASE=$(curl --fail --silent http://127.0.0.1:8080/api/version)
          test "$(jq -r '.source_sha' <<<"$RELEASE")" = "$SOURCE_SHA"
          test "$(jq -r '.image_digest' <<<"$RELEASE")" = "$IMAGE_DIGEST"
          test "$(jq -r '.core_version' <<<"$RELEASE")" = "$CORE_VERSION"
      # The release name points at the digest just verified, never a rebuild.
      - name: Tag verified prebuilt image
        if: >-
          steps.prebuilt.outputs.exists == 'true' &&
          (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        env:
          CORE_TAG: ${{ needs.plan.outputs.core_tag }}
          IMAGE_DIGEST: ${{ steps.digest.outputs.image_digest }}
        run: |
          set -euo pipefail
          crane tag "ghcr.io/typeroll/typeroll@$IMAGE_DIGEST" "$CORE_TAG"
          test "$(crane digest "ghcr.io/typeroll/typeroll:$CORE_TAG")" = "$IMAGE_DIGEST"
      - name: Create verified Core tag
        if: >-
          needs.plan.outputs.publish_core == 'true' &&
          (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        env:
          CORE_TAG: ${{ needs.plan.outputs.core_tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$CORE_TAG" -m "Release $CORE_TAG"
          git push origin "$CORE_TAG"

  mcp:
    name: Publish MCP package
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.23.1'
          registry-url: https://registry.npmjs.org
          scope: '@typeroll'
          cache: npm
      - name: Install Trusted Publishing client
        if: needs.plan.outputs.publish_mcp == 'true'
        run: npm install --global npm@11.6.2
      - name: Install MCP build dependencies
        if: needs.plan.outputs.publish_mcp == 'true'
        run: npm ci
      - name: Inspect npm release state
        id: npm
        env:
          MCP_VERSION: ${{ needs.plan.outputs.mcp_version }}
          PUBLISH_MCP: ${{ needs.plan.outputs.publish_mcp }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        run: |
          if npm view "@typeroll/mcp-server@$MCP_VERSION" version >/dev/null 2>&1; then
            PUBLISHED_SHA=$(npm view "@typeroll/mcp-server@$MCP_VERSION" gitHead 2>/dev/null || true)
            if [ "$PUBLISH_MCP" = 'true' ] && [ "$PUBLISHED_SHA" != "$SOURCE_SHA" ]; then
              echo "::error::The untagged npm package was published from ${PUBLISHED_SHA:-an unknown commit}, not $SOURCE_SHA."
              exit 1
            fi
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Build and inspect MCP package
        if: needs.plan.outputs.publish_mcp == 'true' && steps.npm.outputs.exists != 'true'
        run: |
          npm run build --workspace=@typeroll/mcp-server
          npm publish --dry-run --workspace=@typeroll/mcp-server
      - name: Publish MCP through npm OIDC
        if: >-
          needs.plan.outputs.publish_mcp == 'true' &&
          steps.npm.outputs.exists != 'true' &&
          (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        working-directory: packages/mcp-server
        run: npm publish --access public --provenance
      - name: Verify MCP release
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
        env:
          MCP_VERSION: ${{ needs.plan.outputs.mcp_version }}
        run: |
          # Registry propagation can outlast one minute after a successful publish.
          for _attempt in {1..60}; do
            if [ "$(npm view "@typeroll/mcp-server@$MCP_VERSION" version --prefer-online 2>/dev/null || true)" = "$MCP_VERSION" ]; then exit 0; fi
            sleep 5
          done
          echo "::error::npm did not return @typeroll/mcp-server@$MCP_VERSION."
          exit 1
      - name: Create verified MCP tag
        if: >-
          needs.plan.outputs.publish_mcp == 'true' &&
          (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        env:
          MCP_TAG: ${{ needs.plan.outputs.mcp_tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$MCP_TAG" -m "Release $MCP_TAG"
          git push origin "$MCP_TAG"

  # Lists the released MCP package in the official MCP Registry
  # (registry.modelcontextprotocol.io). GitHub OIDC proves the
  # io.github.Typeroll/* namespace; the registry also checks that the npm
  # package's mcpName matches server.json, so this runs after npm publishing.
  registry:
    name: Publish to the MCP Registry
    needs: [plan, mcp]
    # A registry outage must not turn a finished Core release red; the next
    # release publishes the missing version, and the job log shows the failure.
    continue-on-error: true
    if: >-
      needs.plan.outputs.publish_mcp == 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
      - name: Check server.json against the released package
        id: listing
        env:
          MCP_VERSION: ${{ needs.plan.outputs.mcp_version }}
        working-directory: packages/mcp-server
        run: |
          set -euo pipefail
          NAME=$(jq -r .name server.json)
          test "$NAME" = "$(jq -r .mcpName package.json)"
          test "$(jq -r .version server.json)" = "$MCP_VERSION"
          test "$(jq -r '.packages[0].version' server.json)" = "$MCP_VERSION"
          ENCODED=$(jq -rn --arg name "$NAME" '$name | @uri')
          STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' "https://registry.modelcontextprotocol.io/v0.1/servers/$ENCODED/versions/$MCP_VERSION")
          case "$STATUS" in
            200) echo "$NAME $MCP_VERSION is already listed."; echo 'listed=true' >> "$GITHUB_OUTPUT" ;;
            404) echo 'listed=false' >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::The MCP Registry answered HTTP $STATUS for $NAME $MCP_VERSION."; exit 1 ;;
          esac
      - name: Install cosign
        if: steps.listing.outputs.listed != 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        if: steps.listing.outputs.listed != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - name: Publish server.json with GitHub OIDC
        if: steps.listing.outputs.listed != 'true'
        working-directory: packages/mcp-server
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish

  docs:
    name: Publish public documentation
    if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.23.1'
          cache: npm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.plan.outputs.tests_run_id }}
          name: docs-${{ needs.plan.outputs.source_sha }}
          path: temp/docs-migration
      - name: Verify the qualified documentation artifact
        run: node scripts/release-artifact.mjs verify temp/docs-migration
      - name: Verify documentation deployment token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DOCS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: node packages/docs-site/scripts/deployment-token-info.mjs
      # The deployer comes from the same lockfile as customer static uploads,
      # with integrity-checked transitive dependencies and no install scripts.
      - name: Install locked documentation deployer
        run: |
          set -euo pipefail
          DEPLOYER="$RUNNER_TEMP/docs-deployer"
          mkdir -p "$DEPLOYER"
          cp packages/portal/src/lib/builds/uploader-package.json "$DEPLOYER/package.json"
          cp packages/portal/src/lib/builds/uploader-lock.json "$DEPLOYER/package-lock.json"
          npm ci --prefix "$DEPLOYER" --ignore-scripts --no-audit --no-fund
          echo "WRANGLER=$DEPLOYER/node_modules/.bin/wrangler" >> "$GITHUB_ENV"
      - name: Publish static documentation at typeroll.com/docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DOCS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: '"$WRANGLER" deploy --config packages/docs-site/wrangler.jsonc'
      - name: Verify published documentation
        run: node packages/docs-site/scripts/verify-live-docs.mjs --source-sha "${{ needs.plan.outputs.source_sha }}"

  manifest:
    name: Record release manifest
    if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
    needs: [plan, core, mcp, docs]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.23.1'
      - name: Build Cloud-consumable release manifest
        run: >-
          node scripts/oss-release-plan.mjs
          --manifest oss-upstream.lock.json
          --source-sha "${{ needs.plan.outputs.core_source_sha }}"
          --image-digest "${{ needs.core.outputs.image_digest }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oss-release-${{ needs.plan.outputs.source_sha }}
          path: oss-upstream.lock.json
          retention-days: 90
      - name: Summarize completed train
        env:
          CORE_VERSION: ${{ needs.plan.outputs.core_version }}
          IMAGE_DIGEST: ${{ needs.core.outputs.image_digest }}
          MCP_VERSION: ${{ needs.plan.outputs.mcp_version }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          CORE_SOURCE_SHA: ${{ needs.plan.outputs.core_source_sha }}
        run: |
          {
            echo '### Released OSS train'
            echo
            printf -- '- Core %s at %s\n' "$CORE_VERSION" "$IMAGE_DIGEST"
            printf -- '- MCP %s\n' "$MCP_VERSION"
            printf -- '- Docs from %s\n' "$SOURCE_SHA"
            printf -- '- Core source %s\n' "$CORE_SOURCE_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
