name: Release OSS

# One release train for the public distribution:
# successful main CI -> Core, MCP and docs in parallel -> manifest.
# Keep this filename: npm Trusted Publishing is bound to publish-mcp.yml.

on:
  workflow_run:
    workflows:
      - Tests
    types:
      - completed
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate and build without publishing anything
        type: boolean
        default: true
      confirm_release:
        description: Type RELEASE_TYPEROLL_OSS for a manual real release
        type: string
        required: false

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-oss
  cancel-in-progress: false

jobs:
  plan:
    name: Validate release plan
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.plan.outputs.source_sha }}
      core_source_sha: ${{ steps.plan.outputs.core_source_sha }}
      core_version: ${{ steps.plan.outputs.core_version }}
      core_tag: ${{ steps.plan.outputs.core_tag }}
      publish_core: ${{ steps.plan.outputs.publish_core }}
      mcp_version: ${{ steps.plan.outputs.mcp_version }}
      mcp_tag: ${{ steps.plan.outputs.mcp_tag }}
      publish_mcp: ${{ steps.plan.outputs.publish_mcp }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install documentation dependencies
        run: npm ci --workspace=@typeroll/docs-site
      - name: Validate documentation before publication
        run: node scripts/oss-release-check.mjs --docs-only
      - name: Validate manual publication confirmation
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run != true
        env:
          CONFIRM_RELEASE: ${{ inputs.confirm_release }}
        run: test "$CONFIRM_RELEASE" = 'RELEASE_TYPEROLL_OSS'
      - name: Validate versions and changed scopes
        id: plan
        run: npm run release:plan -- --github-output
      - name: Summarize release plan
        env:
          CORE_VERSION: ${{ steps.plan.outputs.core_version }}
          PUBLISH_CORE: ${{ steps.plan.outputs.publish_core }}
          MCP_VERSION: ${{ steps.plan.outputs.mcp_version }}
          PUBLISH_MCP: ${{ steps.plan.outputs.publish_mcp }}
          SOURCE_SHA: ${{ steps.plan.outputs.source_sha }}
        run: |
          {
            echo '### OSS release plan'
            echo
            echo '| Artifact | Version | Publish |'
            echo '| --- | --- | --- |'
            printf '| Core | %s | %s |\n' "$CORE_VERSION" "$PUBLISH_CORE"
            printf '| MCP | %s | %s |\n' "$MCP_VERSION" "$PUBLISH_MCP"
            printf '| Source | %s | |\n' "$SOURCE_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

  core:
    name: Publish immutable Core
    needs: plan
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.digest.outputs.image_digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify Core release version
        run: npm run core:release:verify -- "${{ needs.plan.outputs.core_tag }}"
      # The exact source SHA has already passed the complete release-candidate
      # workflow. This job proves the release-specific image contract instead
      # of repeating the same source gate.
      - uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b
        with:
          version: v0.22.0
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Inspect existing Core release
        id: registry
        if: needs.plan.outputs.publish_core == 'true'
        env:
          CORE_TAG: ${{ needs.plan.outputs.core_tag }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/typeroll/typeroll:$CORE_TAG"
          set +e
          RESULT=$(crane digest "$IMAGE" 2>&1)
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ]; then
            REVISION=$(crane config "$IMAGE@$RESULT" | jq -r '.config.Labels["org.opencontainers.image.revision"] // empty')
            if [ "$REVISION" != "$SOURCE_SHA" ]; then
              echo "::error::$IMAGE already exists at $RESULT from ${REVISION:-an unknown commit}, not $SOURCE_SHA."
              exit 1
            fi
            echo 'exists=true' >> "$GITHUB_OUTPUT"
            echo "image_digest=$RESULT" >> "$GITHUB_OUTPUT"
          elif grep -Eqi 'manifest unknown|manifest_unknown|name unknown|name_unknown|not found|404' <<<"$RESULT"; then
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          else
            echo "::error::Could not safely determine whether $IMAGE exists: $RESULT"
            exit 1
          fi
      - uses: docker/setup-buildx-action@v4
        if: needs.plan.outputs.publish_core == 'true' && steps.registry.outputs.exists != 'true'
      - name: Build and publish immutable image
        id: image
        if: needs.plan.outputs.publish_core == 'true' && steps.registry.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
          tags: |
            ghcr.io/typeroll/typeroll:${{ needs.plan.outputs.core_tag }}
            ghcr.io/typeroll/typeroll:sha-${{ needs.plan.outputs.source_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.plan.outputs.source_sha }}
            org.opencontainers.image.version=${{ needs.plan.outputs.core_tag }}
          build-args: |
            TYPEROLL_SOURCE_SHA=${{ needs.plan.outputs.source_sha }}
          platforms: linux/amd64
          sbom: true
          provenance: mode=max
      - name: Resolve release digest
        id: digest
        env:
          BUILT_DIGEST: ${{ steps.image.outputs.digest }}
          CORE_TAG: ${{ needs.plan.outputs.core_tag }}
          PUBLISH_CORE: ${{ needs.plan.outputs.publish_core }}
          EXISTING_DIGEST: ${{ steps.registry.outputs.image_digest }}
        run: |
          set -euo pipefail
          if [ -n "$EXISTING_DIGEST" ]; then
            DIGEST="$EXISTING_DIGEST"
          elif [ "$PUBLISH_CORE" = 'true' ]; then
            test -n "$BUILT_DIGEST"
            DIGEST="$BUILT_DIGEST"
          else
            DIGEST=$(crane digest "ghcr.io/typeroll/typeroll:$CORE_TAG")
          fi
          test -n "$DIGEST"
          echo "image_digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Verify published image contract
        if: >-
          needs.plan.outputs.publish_core == 'true' &&
          (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        env:
          IMAGE: ghcr.io/typeroll/typeroll@${{ steps.digest.outputs.image_digest }}
          IMAGE_DIGEST: ${{ steps.digest.outputs.image_digest }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          CORE_VERSION: ${{ needs.plan.outputs.core_version }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          docker run --detach --name typeroll-core-contract \
            --publish 127.0.0.1:8080:8080 \
            --env TYPEROLL_IMAGE_DIGEST="$IMAGE_DIGEST" \
            "$IMAGE"
          trap 'docker rm --force typeroll-core-contract >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/api/healthz >/dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then docker logs typeroll-core-contract; exit 1; fi
            sleep 1
          done
          RELEASE=$(curl --fail --silent http://127.0.0.1:8080/api/version)
          test "$(jq -r '.source_sha' <<<"$RELEASE")" = "$SOURCE_SHA"
          test "$(jq -r '.image_digest' <<<"$RELEASE")" = "$IMAGE_DIGEST"
          test "$(jq -r '.core_version' <<<"$RELEASE")" = "$CORE_VERSION"
      - name: Create verified Core tag
        if: >-
          needs.plan.outputs.publish_core == 'true' &&
          (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        env:
          CORE_TAG: ${{ needs.plan.outputs.core_tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$CORE_TAG" -m "Release $CORE_TAG"
          git push origin "$CORE_TAG"

  mcp:
    name: Publish MCP package
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          scope: '@typeroll'
          cache: npm
      - name: Install Trusted Publishing client
        run: npm install --global npm@11.6.2
      - run: npm ci
      - name: Inspect npm release state
        id: npm
        env:
          MCP_VERSION: ${{ needs.plan.outputs.mcp_version }}
          PUBLISH_MCP: ${{ needs.plan.outputs.publish_mcp }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        run: |
          if npm view "@typeroll/mcp-server@$MCP_VERSION" version >/dev/null 2>&1; then
            PUBLISHED_SHA=$(npm view "@typeroll/mcp-server@$MCP_VERSION" gitHead 2>/dev/null || true)
            if [ "$PUBLISH_MCP" = 'true' ] && [ "$PUBLISHED_SHA" != "$SOURCE_SHA" ]; then
              echo "::error::The untagged npm package was published from ${PUBLISHED_SHA:-an unknown commit}, not $SOURCE_SHA."
              exit 1
            fi
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Build and inspect MCP package
        if: needs.plan.outputs.publish_mcp == 'true' && steps.npm.outputs.exists != 'true'
        run: |
          npm run build --workspace=@typeroll/mcp-server
          npm publish --dry-run --workspace=@typeroll/mcp-server
      - name: Publish MCP through npm OIDC
        if: >-
          needs.plan.outputs.publish_mcp == 'true' &&
          steps.npm.outputs.exists != 'true' &&
          (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        working-directory: packages/mcp-server
        run: npm publish --access public --provenance
      - name: Verify MCP release
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
        env:
          MCP_VERSION: ${{ needs.plan.outputs.mcp_version }}
        run: |
          for _attempt in {1..12}; do
            if [ "$(npm view "@typeroll/mcp-server@$MCP_VERSION" version 2>/dev/null || true)" = "$MCP_VERSION" ]; then exit 0; fi
            sleep 5
          done
          echo "::error::npm did not return @typeroll/mcp-server@$MCP_VERSION."
          exit 1
      - name: Create verified MCP tag
        if: >-
          needs.plan.outputs.publish_mcp == 'true' &&
          (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        env:
          MCP_TAG: ${{ needs.plan.outputs.mcp_tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$MCP_TAG" -m "Release $MCP_TAG"
          git push origin "$MCP_TAG"

  docs:
    name: Publish public documentation
    if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --workspace=@typeroll/docs-site
      - name: Rebuild the validated documentation
        run: node scripts/oss-release-check.mjs --docs-only
      - name: Deploy exact-source docs to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DOCS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler pages deploy packages/docs-site/dist --project-name=typeroll-docs --branch=main --commit-dirty=false

  manifest:
    name: Record release manifest
    if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
    needs: [plan, core, mcp, docs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Build Cloud-consumable release manifest
        run: >-
          node scripts/oss-release-plan.mjs
          --manifest oss-upstream.lock.json
          --source-sha "${{ needs.plan.outputs.core_source_sha }}"
          --image-digest "${{ needs.core.outputs.image_digest }}"
      - uses: actions/upload-artifact@v7
        with:
          name: oss-release-${{ needs.plan.outputs.source_sha }}
          path: oss-upstream.lock.json
          retention-days: 90
      - name: Summarize completed train
        env:
          CORE_VERSION: ${{ needs.plan.outputs.core_version }}
          IMAGE_DIGEST: ${{ needs.core.outputs.image_digest }}
          MCP_VERSION: ${{ needs.plan.outputs.mcp_version }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          CORE_SOURCE_SHA: ${{ needs.plan.outputs.core_source_sha }}
        run: |
          {
            echo '### Released OSS train'
            echo
            printf -- '- Core %s at %s\n' "$CORE_VERSION" "$IMAGE_DIGEST"
            printf -- '- MCP %s\n' "$MCP_VERSION"
            printf -- '- Docs from %s\n' "$SOURCE_SHA"
            printf -- '- Core source %s\n' "$CORE_SOURCE_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
