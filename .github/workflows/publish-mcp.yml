name: Release OSS

# One release train for the public distribution:
# successful main CI -> Core, MCP and docs in parallel -> manifest.
# Keep this filename: npm Trusted Publishing is bound to publish-mcp.yml.

on:
  workflow_run:
    workflows:
      - Tests
    types:
      - completed
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate and build without publishing anything
        type: boolean
        default: true
      confirm_release:
        description: Type RELEASE_TYPEROLL_OSS for a manual real release
        type: string
        required: false

# No default grant: each job requests only what its own steps need.
permissions: {}

concurrency:
  group: release-oss
  cancel-in-progress: false

jobs:
  plan:
    name: Validate release plan
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      tests_run_id: ${{ steps.qualified.outputs.run_id }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      core_source_sha: ${{ steps.plan.outputs.core_source_sha }}
      core_version: ${{ steps.plan.outputs.core_version }}
      core_tag: ${{ steps.plan.outputs.core_tag }}
      publish_core: ${{ steps.plan.outputs.publish_core }}
      mcp_version: ${{ steps.plan.outputs.mcp_version }}
      mcp_tag: ${{ steps.plan.outputs.mcp_tag }}
      publish_mcp: ${{ steps.plan.outputs.publish_mcp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.23.1'
          cache: npm
      - name: Resolve successful source qualification
        id: qualified
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: node scripts/qualified-docs.mjs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.qualified.outputs.run_id }}
          name: docs-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          path: temp/docs-migration
      - name: Verify qualified documentation before publication
        run: node scripts/release-artifact.mjs verify temp/docs-migration
      - name: Validate manual publication confirmation
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run != true
        env:
          CONFIRM_RELEASE: ${{ inputs.confirm_release }}
        run: test "$CONFIRM_RELEASE" = 'RELEASE_TYPEROLL_OSS'
      - name: Validate versions and changed scopes
        id: plan
        run: npm run release:plan -- --github-output
      - name: Summarize release plan
        env:
          CORE_VERSION: ${{ steps.plan.outputs.core_version }}
          PUBLISH_CORE: ${{ steps.plan.outputs.publish_core }}
          MCP_VERSION: ${{ steps.plan.outputs.mcp_version }}
          PUBLISH_MCP: ${{ steps.plan.outputs.publish_mcp }}
          SOURCE_SHA: ${{ steps.plan.outputs.source_sha }}
        run: |
          {
            echo '### OSS release plan'
            echo
            echo '| Artifact | Version | Publish |'
            echo '| --- | --- | --- |'
            printf '| Core | %s | %s |\n' "$CORE_VERSION" "$PUBLISH_CORE"
            printf '| MCP | %s | %s |\n' "$MCP_VERSION" "$PUBLISH_MCP"
            printf '| Source | %s | |\n' "$SOURCE_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

  # Core ships as one Worker bundle: the exact `@astrojs/cloudflare` build of
  # the portal (Forms deploys the same bundle as a second script), packed
  # reproducibly with its release contract, attested with GitHub build
  # provenance and attached to the Core GitHub release. Cloud pins its SHA-256
  # and verifies the attestation before `wrangler versions upload`.
  core:
    name: Publish immutable Core
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: read
    outputs:
      bundle_digest: ${{ steps.bundle.outputs.bundle_digest }}
    env:
      GH_TOKEN: ${{ github.token }}
      CORE_TAG: ${{ needs.plan.outputs.core_tag }}
      CORE_SOURCE_SHA: ${{ needs.plan.outputs.core_source_sha }}
      PUBLISH: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
    steps:
      # The bundle is built from the commit the Core tag names: the release
      # source itself, or the earlier tagged commit when only MCP or docs changed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.core_source_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.23.1'
          cache: npm
      - name: Verify Core release version
        run: npm run core:release:verify -- "$CORE_TAG"
      # A published bundle is immutable: a rerun reuses the asset it finds and
      # verifies it, and never replaces it with a rebuild.
      - name: Inspect published Worker bundle
        id: published
        run: |
          set -euo pipefail
          VERSION="${CORE_TAG#core-v}"
          TARBALL="typeroll-core-$VERSION-workers.tar.gz"
          DESCRIPTOR="typeroll-core-$VERSION-workers.json"
          mkdir -p temp/core-workers
          set +e
          ASSETS=$(gh release view "$CORE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>&1)
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 0 ]; then
            if grep -qi 'release not found' <<<"$ASSETS"; then
              echo 'release=false' >> "$GITHUB_OUTPUT"
              echo 'exists=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::error::Could not safely determine whether release $CORE_TAG exists: $ASSETS"
            exit 1
          fi
          echo 'release=true' >> "$GITHUB_OUTPUT"
          if grep -qxF "$TARBALL" <<<"$ASSETS" && grep -qxF "$DESCRIPTOR" <<<"$ASSETS"; then
            gh release download "$CORE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$TARBALL" --pattern "$DESCRIPTOR" --dir temp/core-workers
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          elif grep -qxF "$TARBALL" <<<"$ASSETS" || grep -qxF "$DESCRIPTOR" <<<"$ASSETS"; then
            echo "::error::Release $CORE_TAG carries only one of $TARBALL and $DESCRIPTOR; inspect it before publishing again."
            exit 1
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Install build dependencies
        if: steps.published.outputs.exists != 'true'
        run: npm ci
      - name: Build the Worker bundle
        if: steps.published.outputs.exists != 'true'
        run: node scripts/release-worker-bundle.mjs build --out temp/core-workers
      - name: Verify the Worker bundle and its release contract
        id: bundle
        run: node scripts/release-worker-bundle.mjs verify --dir temp/core-workers --source-sha "$CORE_SOURCE_SHA" --core-tag "$CORE_TAG"
      # The packed bytes, not the build directory, must answer with this
      # release's identity in local workerd before anything is published.
      - name: Verify the bundle serves its release identity
        if: steps.published.outputs.exists != 'true'
        env:
          TARBALL: ${{ steps.bundle.outputs.tarball }}
          BUNDLE_DIGEST: ${{ steps.bundle.outputs.bundle_digest }}
          CORE_VERSION: ${{ needs.plan.outputs.core_version }}
        run: |
          set -euo pipefail
          SMOKE="$RUNNER_TEMP/core-workers-smoke"
          mkdir -p "$SMOKE"
          tar -xzf "temp/core-workers/$TARBALL" -C "$SMOKE"
          node node_modules/wrangler/bin/wrangler.js dev \
            --config "$SMOKE/portal/server/wrangler.json" \
            --ip 127.0.0.1 --port 8787 \
            --var STORE_JURISDICTION:none \
            --var "TYPEROLL_SOURCE_SHA:$CORE_SOURCE_SHA" \
            --var "TYPEROLL_BUNDLE_DIGEST:$BUNDLE_DIGEST" \
            --var "AUTH_SECRET:$(openssl rand -hex 32)" \
            --var PORTAL_PUBLIC_URL:http://127.0.0.1:8787 \
            --var ACCOUNT_EMAIL:release-check@example.invalid \
            > "$RUNNER_TEMP/workerd.log" 2>&1 &
          WORKERD=$!
          trap 'kill "$WORKERD" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8787/api/healthz >/dev/null; then break; fi
            if [ "$attempt" -eq 60 ]; then cat "$RUNNER_TEMP/workerd.log"; exit 1; fi
            sleep 1
          done
          RELEASE=$(curl --fail --silent http://127.0.0.1:8787/api/version)
          test "$(jq -r '.source_sha' <<<"$RELEASE")" = "$CORE_SOURCE_SHA"
          test "$(jq -r '.bundle_digest' <<<"$RELEASE")" = "$BUNDLE_DIGEST"
          test "$(jq -r '.core_version' <<<"$RELEASE")" = "$CORE_VERSION"
      - name: Attest Worker bundle build provenance
        if: steps.published.outputs.exists != 'true' && env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: temp/core-workers/${{ steps.bundle.outputs.tarball }}
      # The same check Cloud runs before it pins the digest, so a release
      # whose provenance Cloud would refuse never gets a tag.
      - name: Verify Worker bundle provenance
        if: env.PUBLISH == 'true'
        env:
          TARBALL: ${{ steps.bundle.outputs.tarball }}
        run: >-
          gh attestation verify "temp/core-workers/$TARBALL"
          --repo "$GITHUB_REPOSITORY"
          --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish-mcp.yml"
          --source-ref refs/heads/main
          --predicate-type https://slsa.dev/provenance/v1
          --deny-self-hosted-runners
      - name: Create verified Core tag
        if: needs.plan.outputs.publish_core == 'true' && env.PUBLISH == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$CORE_TAG" -m "Release $CORE_TAG"
          git push origin "$CORE_TAG"
      - name: Publish the Worker bundle on the Core release
        if: steps.published.outputs.exists != 'true' && env.PUBLISH == 'true'
        env:
          TARBALL: ${{ steps.bundle.outputs.tarball }}
          DESCRIPTOR: ${{ steps.bundle.outputs.descriptor }}
          BUNDLE_DIGEST: ${{ steps.bundle.outputs.bundle_digest }}
          HAS_RELEASE: ${{ steps.published.outputs.release }}
        run: |
          set -euo pipefail
          if [ "$HAS_RELEASE" = 'true' ]; then
            gh release upload "$CORE_TAG" "temp/core-workers/$TARBALL" "temp/core-workers/$DESCRIPTOR" --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$CORE_TAG" "temp/core-workers/$TARBALL" "temp/core-workers/$DESCRIPTOR" \
              --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "Typeroll Core ${CORE_TAG#core-v}" \
              --notes "Worker bundle $BUNDLE_DIGEST built from $CORE_SOURCE_SHA with GitHub build provenance."
          fi
          CHECK="$RUNNER_TEMP/core-workers-published"
          gh release download "$CORE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$TARBALL" --dir "$CHECK"
          test "sha256:$(sha256sum "$CHECK/$TARBALL" | cut -d' ' -f1)" = "$BUNDLE_DIGEST"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-workers-${{ needs.plan.outputs.source_sha }}
          path: temp/core-workers/${{ steps.bundle.outputs.descriptor }}
          if-no-files-found: error
          retention-days: 90

  mcp:
    name: Publish MCP package
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.23.1'
          registry-url: https://registry.npmjs.org
          scope: '@typeroll'
          cache: npm
      - name: Install Trusted Publishing client
        if: needs.plan.outputs.publish_mcp == 'true'
        run: npm install --global npm@11.6.2
      - name: Install MCP build dependencies
        if: needs.plan.outputs.publish_mcp == 'true'
        run: npm ci
      - name: Inspect npm release state
        id: npm
        env:
          MCP_VERSION: ${{ needs.plan.outputs.mcp_version }}
          PUBLISH_MCP: ${{ needs.plan.outputs.publish_mcp }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        run: |
          if npm view "@typeroll/mcp-server@$MCP_VERSION" version >/dev/null 2>&1; then
            PUBLISHED_SHA=$(npm view "@typeroll/mcp-server@$MCP_VERSION" gitHead 2>/dev/null || true)
            if [ "$PUBLISH_MCP" = 'true' ] && [ "$PUBLISHED_SHA" != "$SOURCE_SHA" ]; then
              echo "::error::The untagged npm package was published from ${PUBLISHED_SHA:-an unknown commit}, not $SOURCE_SHA."
              exit 1
            fi
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Build and inspect MCP package
        if: needs.plan.outputs.publish_mcp == 'true' && steps.npm.outputs.exists != 'true'
        run: |
          npm run build --workspace=@typeroll/mcp-server
          npm publish --dry-run --workspace=@typeroll/mcp-server
      - name: Publish MCP through npm OIDC
        if: >-
          needs.plan.outputs.publish_mcp == 'true' &&
          steps.npm.outputs.exists != 'true' &&
          (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        working-directory: packages/mcp-server
        run: npm publish --access public --provenance
      - name: Verify MCP release
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
        env:
          MCP_VERSION: ${{ needs.plan.outputs.mcp_version }}
        run: |
          # Registry propagation can outlast one minute after a successful publish.
          for _attempt in {1..60}; do
            if [ "$(npm view "@typeroll/mcp-server@$MCP_VERSION" version --prefer-online 2>/dev/null || true)" = "$MCP_VERSION" ]; then exit 0; fi
            sleep 5
          done
          echo "::error::npm did not return @typeroll/mcp-server@$MCP_VERSION."
          exit 1
      - name: Create verified MCP tag
        if: >-
          needs.plan.outputs.publish_mcp == 'true' &&
          (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        env:
          MCP_TAG: ${{ needs.plan.outputs.mcp_tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$MCP_TAG" -m "Release $MCP_TAG"
          git push origin "$MCP_TAG"

  # Lists the released MCP package in the official MCP Registry
  # (registry.modelcontextprotocol.io). GitHub OIDC proves the
  # io.github.Typeroll/* namespace; the registry also checks that the npm
  # package's mcpName matches server.json, so this runs after npm publishing.
  registry:
    name: Publish to the MCP Registry
    needs: [plan, mcp]
    # A registry outage must not turn a finished Core release red; the next
    # release publishes the missing version, and the job log shows the failure.
    continue-on-error: true
    if: >-
      needs.plan.outputs.publish_mcp == 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
      - name: Check server.json against the released package
        id: listing
        env:
          MCP_VERSION: ${{ needs.plan.outputs.mcp_version }}
        working-directory: packages/mcp-server
        run: |
          set -euo pipefail
          NAME=$(jq -r .name server.json)
          test "$NAME" = "$(jq -r .mcpName package.json)"
          test "$(jq -r .version server.json)" = "$MCP_VERSION"
          test "$(jq -r '.packages[0].version' server.json)" = "$MCP_VERSION"
          ENCODED=$(jq -rn --arg name "$NAME" '$name | @uri')
          STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' "https://registry.modelcontextprotocol.io/v0.1/servers/$ENCODED/versions/$MCP_VERSION")
          case "$STATUS" in
            200) echo "$NAME $MCP_VERSION is already listed."; echo 'listed=true' >> "$GITHUB_OUTPUT" ;;
            404) echo 'listed=false' >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::The MCP Registry answered HTTP $STATUS for $NAME $MCP_VERSION."; exit 1 ;;
          esac
      - name: Install cosign
        if: steps.listing.outputs.listed != 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        if: steps.listing.outputs.listed != 'true'
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"
      - name: Publish server.json with GitHub OIDC
        if: steps.listing.outputs.listed != 'true'
        working-directory: packages/mcp-server
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish

  docs:
    name: Publish public documentation
    if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.23.1'
          cache: npm
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.plan.outputs.tests_run_id }}
          name: docs-${{ needs.plan.outputs.source_sha }}
          path: temp/docs-migration
      - name: Verify the qualified documentation artifact
        run: node scripts/release-artifact.mjs verify temp/docs-migration
      - name: Verify documentation deployment token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DOCS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: node packages/docs-site/scripts/deployment-token-info.mjs
      # The deployer comes from the same lockfile as customer static uploads,
      # with integrity-checked transitive dependencies and no install scripts.
      - name: Install locked documentation deployer
        run: |
          set -euo pipefail
          DEPLOYER="$RUNNER_TEMP/docs-deployer"
          mkdir -p "$DEPLOYER"
          cp packages/portal/src/lib/builds/uploader-package.json "$DEPLOYER/package.json"
          cp packages/portal/src/lib/builds/uploader-lock.json "$DEPLOYER/package-lock.json"
          npm ci --prefix "$DEPLOYER" --ignore-scripts --no-audit --no-fund
          echo "WRANGLER=$DEPLOYER/node_modules/.bin/wrangler" >> "$GITHUB_ENV"
      - name: Publish static documentation at typeroll.com/docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_DOCS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: '"$WRANGLER" deploy --config packages/docs-site/wrangler.jsonc'
      - name: Verify published documentation
        run: node packages/docs-site/scripts/verify-live-docs.mjs --source-sha "${{ needs.plan.outputs.source_sha }}"

  manifest:
    name: Record release manifest
    if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
    needs: [plan, core, mcp, docs]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.23.1'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: core-workers-${{ needs.plan.outputs.source_sha }}
          path: temp/core-workers
      - name: Build Cloud-consumable release manifest
        run: >-
          node scripts/oss-release-plan.mjs
          --manifest oss-upstream.lock.json
          --source-sha "${{ needs.plan.outputs.core_source_sha }}"
          --bundle "temp/core-workers/typeroll-core-${{ needs.plan.outputs.core_version }}-workers.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oss-release-${{ needs.plan.outputs.source_sha }}
          path: oss-upstream.lock.json
          retention-days: 90
      - name: Summarize completed train
        env:
          CORE_VERSION: ${{ needs.plan.outputs.core_version }}
          BUNDLE_DIGEST: ${{ needs.core.outputs.bundle_digest }}
          MCP_VERSION: ${{ needs.plan.outputs.mcp_version }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          CORE_SOURCE_SHA: ${{ needs.plan.outputs.core_source_sha }}
        run: |
          {
            echo '### Released OSS train'
            echo
            printf -- '- Core %s Worker bundle %s\n' "$CORE_VERSION" "$BUNDLE_DIGEST"
            printf -- '- MCP %s\n' "$MCP_VERSION"
            printf -- '- Docs from %s\n' "$SOURCE_SHA"
            printf -- '- Core source %s\n' "$CORE_SOURCE_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
