name: Release Core image

on:
  push:
    tags:
      - 'core-v*'

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Dependency security audit
        run: npm run security:audit
      - name: Verify Core source
        run: |
          npm run typecheck
          npm test
          npm run build

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/typeroll/typeroll:${{ github.ref_name }}
            ghcr.io/typeroll/typeroll:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          build-args: |
            TYPEROLL_SOURCE_SHA=${{ github.sha }}
          platforms: linux/amd64
          sbom: true
          provenance: mode=max

      - name: Verify published image contract
        env:
          IMAGE: ghcr.io/typeroll/typeroll@${{ steps.image.outputs.digest }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          docker pull "$IMAGE"
          docker run --detach --name typeroll-core-contract \
            --publish 127.0.0.1:8080:8080 \
            --env TYPEROLL_IMAGE_DIGEST="$IMAGE_DIGEST" \
            "$IMAGE"
          trap 'docker rm --force typeroll-core-contract >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/api/healthz >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              docker logs typeroll-core-contract
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:8080/api/version > /tmp/typeroll-version.json
          node --input-type=module - "$SOURCE_SHA" "$IMAGE_DIGEST" "$RELEASE_TAG" <<'NODE'
          import fs from 'node:fs';
          const manifest = JSON.parse(fs.readFileSync('/tmp/typeroll-version.json', 'utf8'));
          const [, , sourceSha, imageDigest, releaseTag] = process.argv;
          const expectedVersion = releaseTag.replace(/^core-v/, '');
          if (manifest.source_sha !== sourceSha) throw new Error('source_sha mismatch');
          if (manifest.image_digest !== imageDigest) throw new Error('image_digest mismatch');
          if (manifest.core_version !== expectedVersion) throw new Error('core_version/tag mismatch');
          NODE
