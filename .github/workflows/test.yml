name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  plan:
    name: Select source checks
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.plan.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.1'
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/source-check-plan.mjs

  unit:
    name: Release candidate check
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.1'
          cache: 'npm'
      - run: npm ci
      - name: Validate release candidate
        if: needs.plan.outputs.docs_only != 'true'
        run: node scripts/oss-release-check.mjs --release-artifacts
      - name: Validate documentation candidate
        if: needs.plan.outputs.docs_only == 'true'
        run: |
          npm run release:plan
          npm run security:audit
          node scripts/oss-release-check.mjs --docs-only --release-artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: docs-${{ github.sha }}
          path: temp/docs-migration
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  dependencies:
    name: Verify pinned build dependencies
    needs: plan
    if: needs.plan.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.1'
      - run: node scripts/release-dependencies.mjs

  e2e:
    name: Playwright e2e
    needs: plan
    if: needs.plan.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.1'
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright browsers
        run: npm run test:e2e:install --workspace=@typeroll/portal
      - name: Run Playwright
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: packages/portal/playwright-report
          retention-days: 7
