name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  plan:
    name: Select source checks
    runs-on: ubuntu-latest
    outputs:
      lane: ${{ steps.plan.outputs.lane }}
      publish_core: ${{ steps.release.outputs.publish_core }}
      core_tag: ${{ steps.release.outputs.core_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.1'
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/source-check-plan.mjs
      # Decides whether main prebuilds the Core image that Release OSS would publish.
      - name: Plan Core publication
        id: release
        if: github.event_name == 'push'
        run: node scripts/oss-release-plan.mjs --github-output
      # Main skips the gate for this exact tree only when the run below succeeds.
      # Recording is an optimization: its failure never fails a pull request.
      - name: Record the tree this run qualifies
        id: record
        if: >-
          github.event_name == 'pull_request' &&
          steps.plan.outputs.lane == 'full' &&
          github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        run: node scripts/source-check-plan.mjs record temp/pr-qualification
      - uses: actions/upload-artifact@v7
        if: steps.record.outcome == 'success'
        continue-on-error: true
        with:
          name: ${{ steps.record.outputs.name }}
          path: temp/pr-qualification
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  unit:
    name: Release candidate check
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.1'
          cache: 'npm'
      - run: npm ci
      - name: Validate release candidate
        if: needs.plan.outputs.lane != 'docs' && needs.plan.outputs.lane != 'reuse'
        run: node scripts/oss-release-check.mjs --release-artifacts
      # The reuse lane only rebuilds and seals docs: the artifact names this source SHA.
      - name: Validate documentation candidate
        if: needs.plan.outputs.lane == 'docs' || needs.plan.outputs.lane == 'reuse'
        run: |
          npm run release:plan
          npm run security:audit
          node scripts/oss-release-check.mjs --docs-only --release-artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: docs-${{ github.sha }}
          path: temp/docs-migration
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  dependencies:
    name: Verify pinned build dependencies
    needs: plan
    if: needs.plan.outputs.lane != 'docs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.1'
      - run: node scripts/release-dependencies.mjs

  # Builds the image Release OSS would build, while the source is qualified.
  # It pushes only the sha- tag; Release OSS verifies the image contract
  # before it creates any release tag, and builds itself if this image is absent.
  image:
    name: Build Core image
    needs: plan
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'Typeroll/typeroll' &&
      needs.plan.outputs.publish_core == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: ./.github/actions/core-image
        with:
          source_sha: ${{ github.sha }}
          core_tag: ${{ needs.plan.outputs.core_tag }}
          tags: ghcr.io/typeroll/typeroll:sha-${{ github.sha }}

  e2e:
    name: Playwright e2e
    needs: plan
    if: needs.plan.outputs.lane != 'docs' && needs.plan.outputs.lane != 'reuse'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.1'
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright browsers
        run: npm run test:e2e:install --workspace=@typeroll/portal
      - name: Run Playwright
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: packages/portal/playwright-report
          retention-days: 7
