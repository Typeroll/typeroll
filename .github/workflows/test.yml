name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  plan:
    name: Select source checks
    runs-on: ubuntu-latest
    outputs:
      lane: ${{ steps.plan.outputs.lane }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.1'
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/source-check-plan.mjs
      # Main skips the gate for this exact tree only when the run below succeeds.
      # Recording is an optimization: its failure never fails a pull request.
      - name: Record the tree this run qualifies
        id: record
        if: >-
          github.event_name == 'pull_request' &&
          steps.plan.outputs.lane == 'full' &&
          github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        run: node scripts/source-check-plan.mjs record temp/pr-qualification
      - uses: actions/upload-artifact@v7
        if: steps.record.outcome == 'success'
        continue-on-error: true
        with:
          name: ${{ steps.record.outputs.name }}
          path: temp/pr-qualification
          if-no-files-found: error
          retention-days: 7
          overwrite: true

  unit:
    name: Release candidate check
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.1'
          cache: 'npm'
      - run: npm ci
      - name: Validate release candidate
        if: needs.plan.outputs.lane != 'docs' && needs.plan.outputs.lane != 'reuse'
        run: node scripts/oss-release-check.mjs --release-artifacts
      # The reuse lane only rebuilds and seals docs: the artifact names this source SHA.
      - name: Validate documentation candidate
        if: needs.plan.outputs.lane == 'docs' || needs.plan.outputs.lane == 'reuse'
        run: |
          npm run release:plan
          npm run security:audit
          node scripts/oss-release-check.mjs --docs-only --release-artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: docs-${{ github.sha }}
          path: temp/docs-migration
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  dependencies:
    name: Verify pinned build dependencies
    needs: plan
    if: needs.plan.outputs.lane != 'docs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.1'
      - run: node scripts/release-dependencies.mjs

  e2e:
    name: Playwright e2e
    needs: plan
    if: needs.plan.outputs.lane != 'docs' && needs.plan.outputs.lane != 'reuse'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.1'
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright browsers
        run: npm run test:e2e:install --workspace=@typeroll/portal
      - name: Run Playwright
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: packages/portal/playwright-report
          retention-days: 7
