name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Release candidate check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Validate release candidate
        run: node scripts/oss-release-check.mjs

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    # Only run e2e when the complete release-candidate check passes.
    needs: unit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright browsers
        run: npm run test:e2e:install --workspace=@typeroll/portal
      - name: Run Playwright
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: packages/portal/playwright-report
          retention-days: 7
