name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Release candidate check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.1'
          cache: 'npm'
      - run: npm ci
      - name: Validate release candidate
        run: node scripts/oss-release-check.mjs --release-artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: docs-${{ github.sha }}
          path: temp/docs-migration
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  dependencies:
    name: Verify pinned build dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.1'
      - run: node scripts/release-dependencies.mjs

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.1'
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright browsers
        run: npm run test:e2e:install --workspace=@typeroll/portal
      - name: Run Playwright
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: packages/portal/playwright-report
          retention-days: 7
