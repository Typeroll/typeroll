name: typeroll

x-core-service: &core-service
  image: ${TYPEROLL_IMAGE:?Set TYPEROLL_IMAGE to a published image digest in .env}
  platform: linux/amd64
  env_file:
    - .env
  init: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  networks:
    - typeroll

# Every Core role reads the same .env file. Secrets a role never uses are
# blanked in its `environment`, which takes precedence over env_file, so the
# internet-facing forms service and the worker hold only what they need.
# Caddy is the only client of portal and forms and appends exactly one
# X-Forwarded-For hop, so AUTH_TRUST_PROXY_HOPS=1 gives sign-in, MCP OAuth
# and Forms rate limits the visitor's address instead of Caddy's. Raise it
# only when another trusted proxy (such as a CDN) sits in front of Caddy and
# Caddy is configured to trust it.
services:
  portal:
    <<: *core-service
    environment:
      NODE_ENV: production
      TYPEROLL_BACKUP_KEY: ""
      SERVICE_ROLE: portal
      AUTH_TRUST_PROXY_HOPS: ${AUTH_TRUST_PROXY_HOPS:-1}
      DEPLOY_QUEUE: firestore
      PORTAL_PUBLIC_URL: https://${TYPEROLL_PORTAL_HOST:?Set TYPEROLL_PORTAL_HOST in .env}
      FORMS_PUBLIC_URL: https://${TYPEROLL_FORMS_HOST:?Set TYPEROLL_FORMS_HOST in .env}
    expose:
      - "8080"

  forms:
    <<: *core-service
    environment:
      NODE_ENV: production
      TYPEROLL_BACKUP_KEY: ""
      # Forms needs Firebase Admin, FORMS_HMAC_SECRET and
      # INTEGRATIONS_SECRET_KEY (email connectors, webhook secrets) only.
      CLOUDFLARE_API_TOKEN: ""
      R2_ACCESS_KEY_ID: ""
      R2_SECRET_ACCESS_KEY: ""
      PREVIEW_HMAC_SECRET: ""
      MCP_OAUTH_SIGNING_KEY: ""
      EXTENSION_SIGNING_PRIVATE_JWK: ""
      SERVICE_ROLE: forms
      AUTH_TRUST_PROXY_HOPS: ${AUTH_TRUST_PROXY_HOPS:-1}
      DEPLOY_QUEUE: firestore
      PORTAL_PUBLIC_URL: https://${TYPEROLL_PORTAL_HOST:?Set TYPEROLL_PORTAL_HOST in .env}
      FORMS_PUBLIC_URL: https://${TYPEROLL_FORMS_HOST:?Set TYPEROLL_FORMS_HOST in .env}
    expose:
      - "8080"

  worker:
    <<: *core-service
    environment:
      NODE_ENV: production
      TYPEROLL_BACKUP_KEY: ""
      # Publishing needs storage, hosting, Forms and Extension signing, but
      # never mints preview links or MCP OAuth tokens.
      PREVIEW_HMAC_SECRET: ""
      MCP_OAUTH_SIGNING_KEY: ""
      SERVICE_ROLE: worker
      DEPLOY_QUEUE: firestore
      PORTAL_PUBLIC_URL: https://${TYPEROLL_PORTAL_HOST:?Set TYPEROLL_PORTAL_HOST in .env}
      FORMS_PUBLIC_URL: https://${TYPEROLL_FORMS_HOST:?Set TYPEROLL_FORMS_HOST in .env}
    stop_grace_period: 2m

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      portal:
        condition: service_healthy
      forms:
        condition: service_healthy
    environment:
      TYPEROLL_PORTAL_HOST: ${TYPEROLL_PORTAL_HOST:?Set TYPEROLL_PORTAL_HOST in .env}
      TYPEROLL_FORMS_HOST: ${TYPEROLL_FORMS_HOST:?Set TYPEROLL_FORMS_HOST in .env}
      TYPEROLL_ACME_EMAIL: ${TYPEROLL_ACME_EMAIL:?Set TYPEROLL_ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./self-host/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - typeroll

networks:
  typeroll:

volumes:
  caddy_data:
  caddy_config:
